<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2196F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tienda Pro">
<title>Tienda Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" v-cloak :data-theme="cfg.tema">
  <div v-if="cargando" class="loader-screen">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <p class="loader-text">Cargando Tienda Pro...</p>
  </div>

  <!-- Pantalla de Login / Registro -->
  <div v-else-if="!Auth.usuario" class="login-screen">
    <div class="login-box">
      <div class="login-logo"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#fff" stroke-width="2"><path d="M2 7l1.5-4h17L22 7"/><path d="M4 7v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7"/><path d="M2 7h20"/></svg></div>
      <h1>{{ esRegistro ? 'Crear Tienda' : 'Tienda Pro' }}</h1>
      
      <input v-if="esRegistro" v-model="loginForm.nombreTienda" type="text" placeholder="Nombre de tu tienda">
      
      <input v-model="loginForm.email" type="email" placeholder="Correo electrónico">
      <input v-model="loginForm.password" type="password" placeholder="Contraseña" @keyup.enter="esRegistro ? registrarTienda() : iniciarSesion()">
      
      <button class="btn pri" @click="esRegistro ? registrarTienda() : iniciarSesion()">
        {{ esRegistro ? 'Registrar Tienda' : 'Iniciar Sesión' }}
      </button>
      
      <button class="btn ghost" @click="esRegistro = !esRegistro">
        {{ esRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿Primera vez? Crea tu tienda' }}
      </button>
    </div>
  </div>

  <!-- App Principal -->
  <div v-else class="app-container">
    <header class="header no-print">
      <h1><icon name="store" :size="20" color="#fff"></icon> {{Auth.tienda.nombre || 'Tienda Pro'}}</h1>
      <div class="hacts">
        <button class="h-btn" @click="ir('ajustes')" aria-label="Ajustes">
          <icon name="settings" :size="18" color="#fff"></icon><span>Ajustes</span>
        </button>
        <button class="h-btn" @click="cerrarSesion()" aria-label="Salir">
          <icon name="x" :size="18" color="#fff"></icon><span>Salir</span>
        </button>
      </div>
    </header>

    <main>
      <!-- Aquí se inyectarán las vistas en el siguiente paso -->
      <div class="card">
        <div class="card-title">Bienvenido, {{ Auth.perfil.username }}</div>
        <p>La estructura de la Fase 2 está lista. Conectada a Supabase y funcionando Offline.</p>
      </div>
    </main>

    <nav class="nav no-print">
      <button :class="{activo:sec==='dashboard'}" @click="ir('dashboard')" v-if="Auth.perfil.rol==='admin'"><icon name="home" :size="22" :color="navColor(sec==='dashboard')"></icon><span>Inicio</span></button>
      <button :class="{activo:sec==='ventas'}" @click="ir('ventas')"><icon name="cart" :size="22" :color="navColor(sec==='ventas')"></icon><span>Ventas</span></button>
      <button :class="{activo:sec==='compras'}" @click="ir('compras')" v-if="Auth.perfil.rol==='admin'"><icon name="bag" :size="22" :color="navColor(sec==='compras')"></icon><span>Compras</span></button>
      <button :class="{activo:sec==='caja'}" @click="ir('caja')"><icon name="wallet" :size="22" :color="navColor(sec==='caja')"></icon><span>Caja</span></button>
      <button :class="{activo:masAbierto}" @click="masAbierto=true"><icon name="grid" :size="22" :color="navColor(masAbierto)"></icon><span>Más</span></button>
    </nav>

    <div v-if="masAbierto" class="overlay no-print" @click="masAbierto=false"></div>
    <div v-if="masAbierto" class="sheet no-print">
      <div class="handle"></div>
      <div class="sheet-grid">
        <button class="sheet-btn" @click="ir('productos')" v-if="Auth.perfil.rol==='admin'"><icon name="tag" :size="22"></icon>Productos</button>
        <button class="sheet-btn" @click="ir('inventario')" v-if="Auth.perfil.rol==='admin'"><icon name="package" :size="22"></icon>Inventario</button>
        <button class="sheet-btn" @click="ir('patrimonio')" v-if="Auth.perfil.rol==='admin'"><icon name="diamond" :size="22"></icon>Patrimonio</button>
        <button class="sheet-btn" @click="ir('reportes')" v-if="Auth.perfil.rol==='admin'"><icon name="calendar" :size="22"></icon>Reportes</button>
      </div>
    </div>
  </div>

  <div class="toast no-print" :class="[toast.show?'show':'',toast.type]" role="status">
    <span>{{toast.msg}}</span>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="db.js"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="core.js"></script>
</body>
</html>
